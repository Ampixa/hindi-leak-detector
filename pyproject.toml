[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hindi-leakage-lab"
version = "0.1.0"
description = "Inspect Hindi pronunciation transfer in Nepali TTS fine-tunes"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "soundfile>=0.13,<1"]

[project.optional-dependencies]
acoustic = ["torch>=2.5,<3", "transformers>=4.46,<6", "scipy>=1.14,<2"]

[project.scripts]
hindi-leakage = "hindi_detector.cli:main"

[tool.setuptools.packages.find]
include = ["hindi_detector*"]
